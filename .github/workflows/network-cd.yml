name: Network CD

on:
  push:
    branches: [ master, main ]
    paths:
      - workbench/karthick/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-cd-switch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows, netops-lab]
    environment: lab-switch-change
    env:
      SW_USER: ${{ secrets.SW_USER }}
      SW_PASS: ${{ secrets.SW_PASS }}
      SW_ENABLE_PASS: ${{ secrets.SW_ENABLE_PASS }}
      RUN_TS: ${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets are present
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SW_USER)) { throw 'SW_USER is missing' }
          if ([string]::IsNullOrWhiteSpace($env:SW_PASS)) { throw 'SW_PASS is missing' }
          if ([string]::IsNullOrWhiteSpace($env:SW_ENABLE_PASS)) { throw 'SW_ENABLE_PASS is missing' }

      - name: Resolve workspace path in WSL
        id: ws
        shell: powershell
        run: |
          $repoPath = Join-Path $env:GITHUB_WORKSPACE 'workbench\karthick'
          $repoPosix = ($repoPath -replace '\\', '/')
          $wslPath = wsl wslpath -a "$repoPosix"
          "wsl_path=$wslPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Ensure Ansible in WSL
        shell: powershell
        run: |
          wsl -u root bash -lc "ansible --version >/dev/null 2>&1 || (apt-get update && apt-get install -y ansible)"

      - name: Install collections
        shell: powershell
        run: |
          wsl -u root bash -lc "cd '${{ steps.ws.outputs.wsl_path }}' && ANSIBLE_CONFIG='${{ steps.ws.outputs.wsl_path }}/ansible.cfg' ansible-galaxy collection install -r requirements.yml"

      - name: Pre-change backup
        shell: powershell
        run: |
          wsl -u root bash -lc "cd '${{ steps.ws.outputs.wsl_path }}' && ANSIBLE_CONFIG='${{ steps.ws.outputs.wsl_path }}/ansible.cfg' ansible-playbook playbooks/backup.yml"

      - name: Deploy intended config
        shell: powershell
        run: |
          wsl -u root bash -lc "cd '${{ steps.ws.outputs.wsl_path }}' && ANSIBLE_CONFIG='${{ steps.ws.outputs.wsl_path }}/ansible.cfg' ansible-playbook playbooks/deploy.yml"

      - name: Verify intended state
        shell: powershell
        run: |
          wsl -u root bash -lc "cd '${{ steps.ws.outputs.wsl_path }}' && ANSIBLE_CONFIG='${{ steps.ws.outputs.wsl_path }}/ansible.cfg' ansible-playbook playbooks/verify.yml"

      - name: Rollback if verify fails
        if: failure()
        shell: powershell
        run: |
          wsl -u root bash -lc "cd '${{ steps.ws.outputs.wsl_path }}' && ANSIBLE_CONFIG='${{ steps.ws.outputs.wsl_path }}/ansible.cfg' ansible-playbook playbooks/rollback.yml"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-artifacts-${{ github.run_id }}
          path: |
            workbench/karthick/backups/
            workbench/karthick/rendered/
