---
- name: Verify intended state
  hosts: lab_switches
  gather_facts: false
  tasks:
    - name: Check VLAN summary
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_out

    - name: Assert expected VLANs exist
      ansible.builtin.assert:
        that:
          - "'555' in vlan_out.stdout[0]"
        fail_msg: One or more expected VLANs missing.

