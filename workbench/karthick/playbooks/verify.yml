---
- name: Verify intended state
  hosts: lab_switches
  gather_facts: false
  tasks:
    - name: Check VLAN summary
      cisco.ios.ios_command:
        commands:
          - show vlan brief
      register: vlan_out

    - name: Check trunk summary
      cisco.ios.ios_command:
        commands:
          - show interfaces trunk
      register: trunk_out

    - name: Assert expected VLANs exist
      ansible.builtin.assert:
        that:
          - "'10' in vlan_out.stdout[0]"
          - "'20' in vlan_out.stdout[0]"
          - "'30' in vlan_out.stdout[0]"
        fail_msg: One or more expected VLANs missing.

    - name: Assert expected trunk interface appears
      ansible.builtin.assert:
        that:
          - "'Gi1/0/48' in trunk_out.stdout[0] or 'GigabitEthernet1/0/48' in trunk_out.stdout[0]"
        fail_msg: Expected trunk interface not found.
