---
- name: Render and deploy intended config
  hosts: lab_switches
  gather_facts: false
  tasks:
    - name: Ensure rendered folder exists
      ansible.builtin.file:
        path: "{{ rendered_dir }}"
        state: directory
      delegate_to: localhost

    - name: Render intended config
      ansible.builtin.template:
        src: templates/intended_config.j2
        dest: "{{ rendered_dir }}/{{ inventory_hostname }}-intended.cfg"
      delegate_to: localhost

    - name: Push intended config
      cisco.ios.ios_config:
        src: "{{ rendered_dir }}/{{ inventory_hostname }}-intended.cfg"
        backup: true
        save_when: changed
      register: deploy_result

    - name: Show whether changes occurred
      ansible.builtin.debug:
        msg: "Changed={{ deploy_result.changed }}"
